# conda env create -f environment.yml && conda activate ribomine && pip install -e .
name: ribomine
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10,<3.13
  - numpy>=1.24
  - matplotlib-base>=3.7
  - pysam>=0.22
  - ncls>=0.0.68
  - xopen>=1.7

  # alignment and read processing
  - star>=2.7.10
  - bowtie2>=2.5               # contaminant filter
  - samtools>=1.19
  - cutadapt>=4.4              # run by fqdissect to trim
  - pigz>=2.7
  - umicollapse>=1.1           # UMI deduplication (optional, default backend)
  - umi_tools>=1.1.4           # UMI deduplication (alternative backend)

  # download
  - aria2>=1.36                # multi-connection HTTPS from ENA
  - sra-tools>=3.0.10          # prefetch + fasterq-dump, the fallback route

  - pytest>=7.4
