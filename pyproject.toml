[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ribomine"
version = "0.1.0"
description = "Mine Ribo-seq datasets from the SRA: search, QC, read architecture, download, trim, map."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kilian Maidhof" }]
keywords = ["ribo-seq", "ribosome profiling", "SRA", "quality control", "UMI"]
dependencies = [
    "numpy>=1.24",
    "pysam>=0.22",
    "ncls>=0.0.68",
    "matplotlib>=3.7",
    "xopen>=1.7",
    "fqdissect @ git+https://github.com/kilian-m/fqdissect.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ribomine = "ribomine.cli:main"

[project.urls]
Homepage = "https://github.com/kilian-m/RiboMine"

[tool.setuptools.packages.find]
include = ["ribomine*"]

[tool.setuptools.package-data]
# the bundled human contaminant reference
"ribomine.data" = ["*.fa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
